<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#18182c"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="192" height="192" rx="42" fill="url(#bg-grad)" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Neon Circle Frame -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>
  <!-- Lightning Bolt (Dopa Spike) -->
  <path d="M106 28 L56 102 L92 102 L86 164 L136 90 L100 90 Z" fill="url(#bolt-grad)" filter="url(#neon-glow)"/>
</svg>
